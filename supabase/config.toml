# Config CLI Supabase.
#
# 20/7/2026 — INCIDENTE contact-form: un `supabase functions deploy contact-form`
# ha riacceso verify_jwt=true (default CLI quando il flag NON e' dichiarato qui),
# rompendo il form pubblico per ~13 ore (401 al gateway su ogni invio senza JWT).
# LEZIONE: ogni function che deve stare a verify_jwt=false VA DICHIARATA qui,
# altrimenti il prossimo deploy CLI la ribalta. Vedi Trappola 12 in CLAUDE.md.
#
# Le function NON elencate usano il default verify_jwt=true: e' corretto, sono
# tutte protette da JWT (chiamate autenticate o server-to-server con altro gate).

project_id = "noslab-elbrenz"

# --- verify_jwt = false: pubbliche o server-to-server con gate proprio ---
# (honeypot/time-trap/rate-limit, shared secret, HMAC nel path, webhook secret…)

[functions.contact-form]
verify_jwt = false

[functions.send-email]
verify_jwt = false

[functions.andreas-chat]
verify_jwt = false

[functions.scheda-domanda]
verify_jwt = false

[functions.ingest-articoli]
verify_jwt = false

[functions.ingest-doc]
verify_jwt = false

[functions.ingest-chunks]
verify_jwt = false

[functions.wallet-google]
verify_jwt = false

[functions.integrazione-invio]
verify_jwt = false

[functions.solleciti-integrazione]
verify_jwt = false

[functions.telegram-bot]
verify_jwt = false

[functions.telegram-setup]
verify_jwt = false

[functions.newsletter-broadcast]
verify_jwt = false

# 21/7: form/link PUBBLICI chiamati SENZA JWT. Il batch redeploy del 17/7 li
# aveva riaccesi a true (default CLI) -> 401 al gateway = form rotti (segnalato
# un convenzionato). newsletter-unsubscribe a true = disiscrizione rotta (GDPR).
# Dichiarati qui perche' nessun deploy futuro li ribalti (Trappola 12).
[functions.convenzioni-proposta]
verify_jwt = false

[functions.contatti-submit]
verify_jwt = false

[functions.guardiani-contributo]
verify_jwt = false

[functions.download-lead]
verify_jwt = false

[functions.newsletter-unsubscribe]
verify_jwt = false

# 4/8: iscrizione, conferma e disiscrizione sono rami PUBBLICI, chiamati senza
# JWT. I rami amministrativi della stessa funzione hanno il loro gate interno
# (sessione + ruolo >= 50), quindi verify_jwt qui non protegge niente e
# romperebbe soltanto il doppio opt-in.
[functions.newsletter-gestione]
verify_jwt = false

[functions.museo-gg-proposta]
verify_jwt = false

# solleciti-domande (C.5): sollecito direttivo per domande in_attesa >48h.
# Schedulata (pg_cron) e gated da x-ingest-token, mai pubblica: verify_jwt=false.
[functions.solleciti-domande]
verify_jwt = false

# museo-notifica (21/7): notifica direttivo alla pubblicazione di un pezzo del
# museo. Chiamata dall'app col JWT del curatore -> verify_jwt=TRUE (il gateway
# pretende il token; in piu' verifica ruolo lato server). Dichiarato per esplicito.
[functions.museo-notifica]
verify_jwt = true

# museo-donazioni-media (21/7): operazioni Storage sul ramo donazioni per il
# pannello curatore (signed URL + copia file), via service role. Chiamata col
# JWT del curatore -> verify_jwt=true + verifica ruolo lato server.
[functions.museo-donazioni-media]
verify_jwt = true

# tessera-invio: verify_jwt=true (invariato). Gate interno x-ingest-token +
# ramo additivo service-role (21/7). Dichiarato per non derivare col deploy CLI.
[functions.tessera-invio]
verify_jwt = true

# tessera-invio-admin: verify_jwt=true (invariato, gate JWT+AAL2+ruolo interno).
[functions.tessera-invio-admin]
verify_jwt = true

# edge gita (verify_jwt=true, invariato): chiamate dal sito pubblico CON anon key.
# Dichiarate per non derivare col deploy CLI.
[functions.gita-verifica-socio]
verify_jwt = true

[functions.gita-crea-ordine]
verify_jwt = true

[functions.gita-cattura-ordine]
verify_jwt = true

# paypal-webhook: PayPal chiama SENZA JWT Supabase, quindi verify_jwt=true dava
# 401 al gateway e ogni notifica asincrona veniva respinta (rete di sicurezza
# per catture perse/rimborsi spenta, trovato 20/7). Il gate vero e' la verifica
# firma PayPal (verify-webhook-signature + PAYPAL_WEBHOOK_ID), obbligatoria nel
# codice: rifiuta con 400 se verification_status != SUCCESS. Quindi false qui.
[functions.paypal-webhook]
verify_jwt = false

# 21/7: flusso PAGAMENTO tesseramento PUBBLICO (chiamato dal form su elbrenz.eu
# SENZA apikey). Il batch redeploy del 17/7 li aveva flippati a true (default
# CLI, non erano dichiarati) -> 401 "UNAUTHORIZED_NO_AUTH_HEADER" al gateway:
# nessun pagamento PayPal dal 17/7 (outage di 4 giorni, causa radice della
# domanda n.26 senza pagamento). Erano verify_jwt=false (PayPal funzionava prima
# del 17/7 col form che non manda apikey). Gate vero: origin check + firma
# PayPal (capture) + rate limit per IP (ricevuta). Ripristinati a false.
[functions.paypal-create-order]
verify_jwt = false

[functions.paypal-capture-order]
verify_jwt = false

[functions.ricevuta-ocr]
verify_jwt = false

# contanti-registra: registrazione incasso contanti dal pannello admin, con
# sessione admin (verifica ruolo/livello lato server) -> verify_jwt=TRUE.
# Dichiarato per non derivare col deploy CLI (Trappola 12).
[functions.contanti-registra]
verify_jwt = true

# tessera-download: oltre a verify_jwt=false, ha static file (wasm + font) che
# vanno dichiarati o il deploy CLI non li impacchetta.
[functions.tessera-download]
enabled = true
verify_jwt = false
entrypoint = "./functions/tessera-download/index.ts"
static_files = [
  "./functions/tessera-download/index_bg.wasm",
  "./functions/tessera-download/fonts/PlayfairDisplay-Regular.ttf",
  "./functions/tessera-download/fonts/PlayfairDisplay-Italic.ttf",
]

# =============================================================================
# CENSIMENTO ANTI-OUTAGE (23/7/2026) — dichiarazione ESPLICITA di tutte le
# function di produzione che restavano affidate al default verify_jwt=true.
# Valori allineati 1:1 allo stato LIVE (supabase functions list del 23/7):
# nessun cambio di comportamento, solo blindatura del manifest cosi' che un
# batch redeploy non possa flippare il flag di una function non dichiarata.
# Tutte chiamate CON un JWT valido (anon-key dal browser o JWT utente) + gate
# interno lato server: verify_jwt=TRUE e' corretto e va conservato.
# =============================================================================

# OTP login: chiamate dal browser PRIMA del login con l'anon-key (che e' un JWT
# valido) -> il gateway a verify_jwt=true passa; l'OTP vero e' gate interno.
[functions.otp-request]
verify_jwt = true

[functions.otp-verify]
verify_jwt = true

# andreas-hofer: variante KB Andreas Hofer, chiamata con anon-key/JWT.
[functions.andreas-hofer]
verify_jwt = true

# articolo-azione: azioni redazionali, JWT utente + getUser + gate ruolo.
[functions.articolo-azione]
verify_jwt = true

# avatar-upload: upload avatar dell'utente loggato (getUser + gate).
[functions.avatar-upload]
verify_jwt = true

# carica-media: upload media dell'utente loggato (getUser + gate).
[functions.carica-media]
verify_jwt = true

# push-config: espone la config push (VAPID public), chiamata con anon-key.
[functions.push-config]
verify_jwt = true

# telegram-link-token: genera il token di collegamento Telegram per l'utente
# loggato (getUser + gate).
[functions.telegram-link-token]
verify_jwt = true

# invia-push: LIVE a verify_jwt=true. NOTA: usa un gate x-webhook-secret; se in
# futuro dovesse essere invocata server-to-server SENZA JWT (es. da un webhook
# DB), servira' verify_jwt=false. Verificare col mittente reale prima di
# cambiarla. Per ora si codifica lo stato che funziona (true). // TODO verify
[functions.invia-push]
verify_jwt = true

# wp-import: import WordPress one-off via service role, NON deployata in prod
# (solo nel repo). Se un giorno la si deploya, il default true e' l'intento:
# invocazione manuale con service-role key (JWT valido), mai anonima.
[functions.wp-import]
verify_jwt = true

# Donazioni Museo Grande Guerra: form pubblico multipart (famiglie non loggate).
[functions.donazione-upload]
verify_jwt = false

# NOTA: test-search e andreas-test sono function scratch (verify_jwt=false in
# prod) da ELIMINARE, non da blindare. Vanno rimosse dalla dashboard Supabase
# (azione distruttiva: la fa Cristian). Finche' esistono, non ridistribuirle.

# --- Radar eventi Valli del Noce (BLOCCO 2, 31/7/2026) -------------------
# harvest e classifica: schedulate, gate x-ingest-token == INGEST_TOKEN, mai
# invocate da un browser -> verify_jwt=false (il gate e' il token, non il JWT).
[functions.radar-eventi-harvest]
verify_jwt = false

[functions.radar-eventi-classifica]
verify_jwt = false

# radar-eventi-azione: chiamata dalla pagina /radar-eventi col JWT del curatore
# -> verify_jwt=true, piu' verifica del ruolo lato server (>=20 per curare,
# >=50 per pubblicare, imposto anche dal trigger di guardia a DB).
[functions.radar-eventi-azione]
verify_jwt = true

# Manutenzione amministrativa: il gate e' INGEST_TOKEN nell'header, non il JWT.
# Senza questa dichiarazione il deploy CLI rimetterebbe verify_jwt=true e la
# funzione risponderebbe 401 al gateway (Trappola 12).
[functions.tessere-qr-orfani]
verify_jwt = false

# Promemoria della quota al socio: il gate e' INGEST_TOKEN nell'header.
# Senza questa dichiarazione il deploy CLI rimetterebbe verify_jwt=true
# (Trappola 12).
[functions.solleciti-quota]
verify_jwt = false

# guardiani-digest: canale amministrativo (gate x-ingest-token), chiamato dal
# cron. Nessun browser lo chiama: verify_jwt = false come gli altri server-to-server.
[functions.guardiani-digest]
verify_jwt = false

[functions.link-pagamento]
# Riservata: la funzione richiede una sessione e ruolo >= 50, e il gateway
# fa da prima porta. Vedi Trappola 12: ogni function va dichiarata qui,
# altrimenti un deploy la riporta al valore predefinito in silenzio.
verify_jwt = true

[functions.reazione-pubblica]
# Pubblica: chiunque puo' dire «la conosco anch'io», anche senza account.
# Trappola 12: senza questa dichiarazione un deploy la riporterebbe a
# verify_jwt=true e il gateway respingerebbe ogni tocco con un 401 muto.
verify_jwt = false

[functions.lemma-correzione]
# Pubblica: chiunque legga una scheda puo' segnalare che qualcosa non torna.
# Trappola 12: senza questa dichiarazione un deploy la riporterebbe a
# verify_jwt=true e ogni segnalazione morirebbe con un 401 muto al gateway.
verify_jwt = false

[functions.lemma-commento]
# Pubblica: chiunque legga una parola puo' lasciare la sua testimonianza.
# Trappola 12: senza questa dichiarazione un deploy la riporterebbe a
# verify_jwt=true e ogni ricordo morirebbe con un 401 muto al gateway.
verify_jwt = false
